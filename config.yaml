app:
  name: rk3588-cpp-edge-vision-nvr-lite
  web_port: 8080
  save_events: true
  event_dir: data/events
  save_preview_video: true
  preview_video_path: data/events/annotated_preview.mp4
  web_jpeg_interval_ms: 80

video:
  source: video/test.mp4
  width: 640
  height: 480
  reconnect: true

model:
  path: models/yolov8n.rknn
  input_width: 640
  input_height: 640
  classes: classes.txt
  conf_threshold: 0.25
  nms_threshold: 0.45
  letterbox_value: 0

runtime:
  use_rknn: true
  npu_core_mask: 7
  worker0_core_mask: 1
  worker1_core_mask: 2
  worker2_core_mask: 4
  use_all_cores: false
  num_workers: 3
  queue_size: 2
  loop_video: true
  draw_fps: true
  benchmark: false
  benchmark_frames: 300

mqtt:
  enable: false
  host: 127.0.0.1
  port: 1883
  topic: rk3588/events
